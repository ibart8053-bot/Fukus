<style>
/* ==== Ported verbatim from the recovered index.css ==== */
:root {
  --isb-black:#07090c; --isb-void:#040507; --isb-panel:#0d0f14; --isb-panel2:#0a0b0f;
  --isb-panel3:#111318; --isb-border:#1f2937; --isb-border2:#2d3748; --isb-dim:#6b7280;
  --isb-steel:#9ca3af; --isb-text:#c9d2e0; --isb-red:#e11d2a; --isb-redsoft:#7f1d1d;
  --isb-redglow:#f87171; --isb-reddeep:#450a0a; --isb-amber:#f59e0b; --isb-green:#10b981;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background-color:var(--isb-black);color:var(--isb-text);font-family:'Rajdhani',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;color-scheme:dark;}

.isb-grid-bg{background-image:linear-gradient(rgba(225,29,42,.05) 1px, transparent 1px),linear-gradient(90deg, rgba(225,29,42,.05) 1px, transparent 1px);background-size:48px 48px;}

.isb-scanlines::after{content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);mix-blend-mode:multiply;}

.isb-scan-line{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(225,29,42,.9) 50%,transparent 100%);box-shadow:0 0 20px 3px rgba(225,29,42,.5),0 0 60px 6px rgba(225,29,42,.15);z-index:55;pointer-events:none;animation:scan-down 7s linear infinite;}
@keyframes scan-down{0%{top:-2%;opacity:0;}6%{opacity:1;}94%{opacity:1;}100%{top:102%;opacity:0;}}

.isb-corners{position:relative;}
.isb-corners::before,.isb-corners::after{content:'';position:absolute;width:14px;height:14px;border-color:rgba(225,29,42,.7);border-style:solid;transition:width .3s ease,height .3s ease,border-color .3s ease;}
.isb-corners::before{top:0;left:0;border-width:2px 0 0 2px;}
.isb-corners::after{bottom:0;right:0;border-width:0 2px 2px 0;}
.isb-corners-hover:hover::before,.isb-corners-hover:hover::after{width:20px;height:20px;border-color:rgba(225,29,42,1);}

.glow-red{text-shadow:0 0 8px rgba(225,29,42,.8),0 0 24px rgba(225,29,42,.4);}
.glow-red-strong{text-shadow:0 0 4px rgba(225,29,42,1),0 0 16px rgba(225,29,42,.8),0 0 40px rgba(225,29,42,.4);}
.glow-amber{text-shadow:0 0 8px rgba(245,158,11,.8),0 0 20px rgba(245,158,11,.3);}
.glow-green{text-shadow:0 0 8px rgba(16,185,129,.8),0 0 20px rgba(16,185,129,.3);}

.img-card-wrap{position:relative;overflow:hidden;}
.img-scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(225,29,42,.9) 50%,transparent 100%);box-shadow:0 0 12px 2px rgba(225,29,42,.6);top:-4px;pointer-events:none;z-index:10;opacity:0;}
.img-card-wrap:hover .img-scan{animation:img-scan-anim .7s ease-in forwards;}
@keyframes img-scan-anim{0%{top:0%;opacity:1;}100%{top:102%;opacity:.3;}}
.img-card-wrap::before{content:'';position:absolute;inset:0;z-index:5;background-image:linear-gradient(rgba(225,29,42,.07) 1px, transparent 1px),linear-gradient(90deg, rgba(225,29,42,.07) 1px, transparent 1px);background-size:24px 24px;opacity:0;transition:opacity .4s ease;pointer-events:none;}
.img-card-wrap:hover::before{opacity:1;}

.card-hover{transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(225,29,42,.15),0 0 0 1px rgba(225,29,42,.3);border-color:rgba(225,29,42,.4) !important;}

@keyframes flicker{0%,90%,100%{opacity:1;}91%{opacity:.7;}93%{opacity:1;}95%{opacity:.4;}97%{opacity:1;}99%{opacity:.8;}}
.animate-flicker{animation:flicker 5s ease-in-out infinite;}
@keyframes pulse-slow{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:.7;transform:scale(1.08);}}
.animate-pulse-slow{animation:pulse-slow 3s ease-in-out infinite;}
@keyframes ring-pulse{0%{transform:scale(1);opacity:.6;}100%{transform:scale(2.2);opacity:0;}}
.ring-pulse{position:relative;}
.ring-pulse::before,.ring-pulse::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(225,29,42,.6);animation:ring-pulse 2s ease-out infinite;}
.ring-pulse::after{animation-delay:1s;}

@keyframes fade-in{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:translateY(0);}}
.fade-in{animation:fade-in .7s ease-out both;}
@keyframes slide-left{0%{opacity:0;transform:translateX(-24px);}100%{opacity:1;transform:translateX(0);}}
.slide-left{animation:slide-left .5s ease-out both;}
@keyframes slide-right{0%{opacity:0;transform:translateX(24px);}100%{opacity:1;transform:translateX(0);}}
.slide-right{animation:slide-right .5s ease-out both;}

@keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
.type-cursor::after{content:'_';display:inline-block;margin-left:1px;animation:blink 1s step-end infinite;color:var(--isb-red);}

@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.bar-shimmer{background-image:linear-gradient(90deg, transparent 25%, rgba(255,255,255,.3) 50%, transparent 75%);background-size:200% 100%;animation:shimmer 2.2s linear infinite;}

@keyframes data-stream{0%{transform:translateY(-100%);opacity:0;}10%{opacity:.4;}90%{opacity:.4;}100%{transform:translateY(200%);opacity:0;}}
.data-stream-line{position:absolute;width:1px;background:linear-gradient(0deg, transparent, rgba(225,29,42,.5), transparent);animation:data-stream 4s ease-in-out infinite;}

.timeline-line{position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(0deg, transparent, var(--isb-border) 10%, var(--isb-border) 90%, transparent);transform:translateX(-50%);}
.timeline-dot{width:12px;height:12px;border-radius:50%;background:var(--isb-red);box-shadow:0 0 12px rgba(225,29,42,.8),0 0 24px rgba(225,29,42,.4);flex-shrink:0;}

.nav-item{position:relative;transition:color .2s ease, background .2s ease;}
.nav-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--isb-red);transform:scaleY(0);transition:transform .25s ease;box-shadow:0 0 10px rgba(225,29,42,.8);}
.nav-item:hover::before,.nav-item.active::before{transform:scaleY(1);}
.nav-item:hover,.nav-item.active{color:#fff;background:linear-gradient(90deg, rgba(225,29,42,.18), transparent);text-shadow:0 0 10px rgba(225,29,42,.8);}

.tier-ally{color:var(--isb-green);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08);}
.tier-neutral{color:var(--isb-amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08);}
.tier-threat{color:var(--isb-redglow);border-color:rgba(225,29,42,.5);background:rgba(225,29,42,.1);}

.trust-bar-inner{transition:width 1.2s cubic-bezier(.4,0,.2,1);}
.lightbox{animation:fade-in .3s ease-out both;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--isb-black);}
::-webkit-scrollbar-thumb{background:var(--isb-border);border-radius:0;}
::-webkit-scrollbar-thumb:hover{background:var(--isb-red);}

@keyframes orbit{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes orbit-reverse{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
.ring-orbit{animation:orbit 12s linear infinite;}
.ring-orbit-r{animation:orbit-reverse 8s linear infinite;}
</style>

// ============================================================================
// Typewriter
// ============================================================================
function typewriter(node, text, speed, onDone){
  let i=0;
  const id=setInterval(()=>{
    if(i<=text.length){ node.textContent=text.slice(0,i); i++; }
    else { clearInterval(id); if(onDone) onDone(); }
  }, speed);
  return id;
}

        <div class="mt-2 font-mono text-[9px] text-isb-dim tracking-widest text-left" id="intro-progress-log"></div>
      </div>
    </div>
  </div>`);
  root.appendChild(intro);

  const line1El = intro.querySelector('#intro-line1');
  const line2El = intro.querySelector('#intro-line2');
  const progWrap = intro.querySelector('#intro-progress-wrap');
  const progBar = intro.querySelector('#intro-progress-bar');
  const progPct = intro.querySelector('#intro-progress-pct');
  const progLog = intro.querySelector('#intro-progress-log');

  setTimeout(()=>{
    typewriter(line1El, 'ИМПЕРСКОЕ БЮРО БЕЗОПАСНОСТИ', 45, ()=>{

          progWrap.classList.remove('hidden');
          const duration = 3200;
          const startTime = performance.now();
          function tick(now){
            const t = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - t, 3); // smooth ease-out cubic
            const val = eased * 100;
            progBar.style.width = val + '%';
            progPct.textContent = Math.floor(val) + '%';

            if(t < 1){ requestAnimationFrame(tick); }
            else { setTimeout(onComplete, 600); }
          }
          requestAnimationFrame(tick);
        });
      }, 150);
    });
  }, 300);
}

        <div class="h-px w-32" style="background:linear-gradient(90deg, transparent, rgba(225,29,42,.6), transparent)"></div>
      </div>
    </div>
    <div id="combat-skills-root" class="border border-isb-border isb-corners p-6 md:p-10 mb-8" style="background:linear-gradient(135deg, rgba(13,15,20,.95), rgba(7,9,12,.95))">
      <div class="flex items-center gap-3 mb-8">
        <div class="h-1.5 w-1.5 rounded-full bg-isb-red animate-pulse"></div>
        <h3 class="font-display text-[10px] font-bold tracking-[0.4em] text-isb-red">БОЕВЫЕ ПОКАЗАТЕЛИ</h3>
        <div class="flex-1 h-px" style="background:linear-gradient(90deg, rgba(225,29,42,.3), transparent)"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-5">
        ${COMBAT_SKILLS.map((s,i)=>skillBarHTML(s.label,s.value,i)).join('')}
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <div class="border border-isb-border isb-corners card-hover p-6" style="background:linear-gradient(135deg, rgba(13,15,20,.9), rgba(7,9,12,.9))">
        <div class="font-mono text-[9px] text-isb-dim tracking-widest mb-4">ОСНОВНОЕ ОРУЖИЕ</div>
        <p class="font-display text-base font-bold text-isb-redglow tracking-wider glow-red">Красный световой меч</p>
      </div>
      <div class="border border-isb-border isb-corners card-hover p-6" style="background:linear-gradient(135deg, rgba(13,15,20,.9), rgba(7,9,12,.9))">
        <div class="font-mono text-[9px] text-isb-dim tracking-widest mb-4">СТИЛЬ БОЯ</div>
        <p class="font-body text-base text-isb-text leading-relaxed">Точные и рассчитанные удары</p>
      </div>
      <div class="border border-isb-border isb-corners card-hover p-6" style="background:linear-gradient(135deg, rgba(13,15,20,.9), rgba(7,9,12,.9))">
        <div class="font-mono text-[9px] text-isb-dim tracking-widest mb-4">ТИПЫ ЗАДАНИЙ</div>
        <ul class="space-y-2">
          ${MISSION_TYPES.map(m=>`<li class="flex items-center gap-2 font-body text-sm text-isb-text group"><span class="text-isb-red text-xs group-hover:text-isb-redglow transition-colors">▸</span><span class="group-hover:text-white transition-colors">${m}</span></li>`).join('')}
        </ul>
      </div>
    </div>
  </section>`);

  const skillsRoot = section.querySelector('#combat-skills-root');
  const obs = new IntersectionObserver(([e])=>{
    if(!e.isIntersecting) return;
    section.querySelectorAll('.skill-bar').forEach(bar=>{
      const value = +bar.getAttribute('data-value');
      const delay = +bar.getAttribute('data-delay');
      setTimeout(()=>{
        bar.querySelector('.skill-fill').style.width = value+'%';
        bar.querySelector('.skill-pct').textContent = value+'%';
        const tip = bar.querySelector('.skill-tip');
        tip.style.left = value+'%';
        tip.style.opacity = '1';
        tip.style.transitionDelay = delay+'ms';
      }, delay);
    });
    obs.disconnect();
  }, { threshold:0.2 });
  obs.observe(skillsRoot);

  return section;
}

// ============================================================================
// Relationships section
// ============================================================================
function relationCardHTML(rel, index){
  const meta = TIER_META[rel.tier];
  const statusColor = rel.tier==='threat'?'text-isb-red glow-red':rel.tier==='ally'?'text-isb-green':'text-isb-amber';
  return `
  <div class="rel-card border border-isb-border isb-corners card-hover p-5 fade-in" style="background:linear-gradient(135deg, rgba(13,15,20,.95), rgba(7,9,12,.95));animation-delay:${index*0.06}s" data-trust="${rel.trust}" data-bar="${meta.bar}" data-delay="${index*80}">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div>
        <div class="font-display text-sm font-bold tracking-wider text-white mb-1">${rel.name}</div>
        <div class="font-mono text-[9px] text-isb-dim tracking-widest">${rel.role}</div>
      </div>
      <span class="flex-shrink-0 font-mono text-[8px] tracking-widest px-2 py-1 border rounded-sm ${meta.css}">${meta.label}</span>
    </div>
    <div class="space-y-1.5 mb-4">
      <div class="flex gap-3 items-baseline"><span class="font-mono text-[9px] text-isb-dim tracking-widest w-24 flex-shrink-0">ПРИНАДЛЕЖНОСТЬ</span><span class="font-body text-xs text-isb-text">${rel.affiliation}</span></div>
      <div class="flex gap-3 items-baseline"><span class="font-mono text-[9px] text-isb-dim tracking-widest w-24 flex-shrink-0">СТАТУС</span><span class="font-display text-xs font-semibold tracking-wider ${statusColor}">${rel.status}</span></div>
    </div>
    <div class="mb-4">
      <div class="flex justify-between font-mono text-[8px] text-isb-dim tracking-widest mb-1.5">
        <span>${rel.tier==='threat'?'УРОВЕНЬ УГРОЗЫ':'УРОВЕНЬ ДОВЕРИЯ'}</span>
        <span class="rel-pct" style="color:${meta.bar}">0%</span>
      </div>
      <div class="relative h-1.5 bg-isb-panel2 border border-isb-border overflow-hidden">
        <div class="rel-fill absolute left-0 top-0 h-full trust-bar-inner" style="width:0%;background:${meta.bar};opacity:.85"></div>
      </div>
    </div>
    <div class="pt-3 border-t border-isb-border/50">
      <p class="font-body text-[13px] text-isb-dim leading-relaxed italic">${rel.notes}</p>
    </div>
  </div>`;
}

function renderRelations(){
  const section = el(`
  <section id="relations" class="px-4 md:px-12 py-16 max-w-5xl mx-auto">
    ${sectionHeaderHTML('ВЗАИМООТНОШЕНИЯ', `СЕТЬ КОНТАКТОВ // ${RELATIONS.length} ЗАПИСЕЙ`)}
    <div class="grid grid-cols-3 gap-4 mb-10" id="rel-filters">
      ${['ally','neutral','threat'].map(tier=>{
        const m = TIER_META[tier];
        const count = RELATIONS.filter(r=>r.tier===tier).length;
        return `<button data-tier="${tier}" class="rel-filter-btn border isb-corners p-4 text-center card-hover transition-all border-isb-border" style="background:rgba(13,15,20,.6)">
          <div class="font-display text-2xl font-black mb-1 text-isb-steel filter-count">${count}</div>
          <div class="font-mono text-[9px] tracking-widest text-isb-dim filter-label">${m.label}</div>
        </button>`;
      }).join('')}
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5" id="rel-cards-grid">
      ${RELATIONS.map((r,i)=>relationCardHTML(r,i)).join('')}
    </div>
    <div class="mt-10 border border-isb-border/50 p-4 fade-in" style="background:rgba(225,29,42,.04);border-color:rgba(225,29,42,.2)">
      <div class="flex items-start gap-3">
        <div class="h-1.5 w-1.5 rounded-full bg-isb-red mt-1.5 animate-pulse flex-shrink-0"></div>
        <p class="font-mono text-[10px] text-isb-red/70 tracking-wider leading-relaxed">
          ПРЕДУПРЕЖДЕНИЕ: Данный реестр является внутренним документом Имперского Бюро Безопасности.
          Разглашение сведений третьим лицам не допускается.
        </p>
      </div>
    </div>
  </section>`);

  // Reveal trust bars on scroll
  section.querySelectorAll('.rel-card').forEach(card=>{
    const obs = new IntersectionObserver(([e])=>{
      if(!e.isIntersecting) return;
      const delay = +card.getAttribute('data-delay');
      setTimeout(()=>{
        const trust = card.getAttribute('data-trust');
        card.querySelector('.rel-fill').style.width = trust+'%';
        card.querySelector('.rel-pct').textContent = trust+'%';
      }, delay);
      obs.disconnect();
    }, { threshold:0.1 });
    obs.observe(card);
  });

  // Filter buttons
  let activeFilter = 'all';
  section.querySelectorAll('.rel-filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tier = btn.getAttribute('data-tier');
      activeFilter = activeFilter===tier ? 'all' : tier;
      section.querySelectorAll('.rel-filter-btn').forEach(b=>{
        const t = b.getAttribute('data-tier');
        const m = TIER_META[t];
        const isActive = activeFilter===t;
        b.className = `rel-filter-btn border isb-corners p-4 text-center card-hover transition-all ${isActive? m.css+' border-current':'border-isb-border'}`;
        b.style.background = isActive?'':'rgba(13,15,20,.6)';
        const countEl = b.querySelector('.filter-count');
        const labelEl = b.querySelector('.filter-label');
        countEl.style.color = isActive?m.bar:'';
        countEl.style.textShadow = isActive?`0 0 12px ${m.bar}80`:'';
        countEl.className = `font-display text-2xl font-black mb-1 filter-count ${isActive?'':'text-isb-steel'}`;
        labelEl.style.color = isActive?m.bar:'';
        labelEl.className = `font-mono text-[9px] tracking-widest filter-label ${isActive?'':'text-isb-dim'}`;
      });
      section.querySelectorAll('.rel-card').forEach(card=>{
        const name = card.querySelector('.font-display.text-sm').textContent;
        const rel = RELATIONS.find(r=>r.name===name);
        card.style.display = (activeFilter==='all' || rel.tier===activeFilter) ? '' : 'none';
      });
    });
  });

  return section;
}

// ============================================================================
// Gallery section (with lightbox)
// ============================================================================
function renderGallery(){
  const itemsHTML = GALLERY_ITEMS.map((item,i)=>`
    <button data-idx="${i}" class="gallery-item group relative block fade-in" style="animation-delay:${i*0.07}s">
      ${item.image ? imageCardHTML(item.image, item.label, item.variant, 'group', item.objectPosition) : placeholderCardHTML(item.label, item.variant)}
      <div class="absolute inset-0 flex flex-col items-start justify-end p-3 bg-gradient-to-t from-isb-black/95 via-isb-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
        <span class="font-mono text-[9px] text-isb-redglow tracking-widest">${item.category}</span>
        <span class="font-mono text-[8px] text-isb-dim tracking-widest mt-0.5">▸ УВЕЛИЧИТЬ</span>
      </div>
      <div class="absolute inset-0 border-2 border-isb-red opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none" style="box-shadow:inset 0 0 20px rgba(225,29,42,.1)"></div>
    </button>`).join('');

  const section = el(`
  <section id="gallery" class="px-4 md:px-12 py-16 max-w-5xl mx-auto">
    ${sectionHeaderHTML('ГАЛЕРЕЯ', 'ВИЗУАЛЬНЫЙ АРХИВ // 6 МАТЕРИАЛОВ')}
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">${itemsHTML}</div>
    <div id="lightbox-root"></div>
  </section>`);

  let lightboxIdx = null;
  const lightboxRoot = section.querySelector('#lightbox-root');

  function renderLightbox(){
    if(lightboxIdx===null){ lightboxRoot.innerHTML=''; return; }
    const item = GALLERY_ITEMS[lightboxIdx];
    lightboxRoot.innerHTML = `
      <div class="fixed inset-0 z-[80] bg-isb-black/97 backdrop-blur-sm flex items-center justify-center p-6 lightbox" id="lightbox-overlay">
        <button id="lb-prev" class="absolute left-4 top-1/2 -translate-y-1/2 font-mono text-xs text-isb-steel border border-isb-border px-3 py-2 hover:text-isb-red hover:border-isb-red transition-colors z-10">◂</button>
        <button id="lb-close" class="absolute top-5 right-5 font-mono text-xs text-isb-red tracking-widest border border-isb-red/50 px-3 py-1.5 hover:bg-isb-red/20 transition-colors z-10">ЗАКРЫТЬ [ESC]</button>
        <button id="lb-next" class="absolute right-4 top-1/2 -translate-y-1/2 font-mono text-xs text-isb-steel border border-isb-border px-3 py-2 hover:text-isb-red hover:border-isb-red transition-colors z-10">▸</button>
        <div class="max-w-3xl w-full" id="lb-content">
          ${item.image ? imageCardHTML(item.image, item.label, item.variant, '', item.objectPosition) : placeholderCardHTML(item.label, item.variant)}
          <div class="mt-4 flex items-center justify-center gap-4">
            <div class="h-px w-12" style="background:linear-gradient(90deg, transparent, rgba(225,29,42,.4))"></div>
            <span class="font-mono text-xs text-isb-redglow tracking-widest">${item.category}</span>
            <div class="font-mono text-[9px] text-isb-dim">${lightboxIdx+1} / ${GALLERY_ITEMS.length}</div>
            <div class="h-px w-12" style="background:linear-gradient(90deg, rgba(225,29,42,.4), transparent)"></div>
          </div>
        </div>
      </div>`;
    const overlay = lightboxRoot.querySelector('#lightbox-overlay');
    overlay.addEventListener('click', ()=>{ lightboxIdx=null; renderLightbox(); });
    lightboxRoot.querySelector('#lb-content').addEventListener('click', e=>e.stopPropagation());
    lightboxRoot.querySelector('#lb-close').addEventListener('click', e=>{ e.stopPropagation(); lightboxIdx=null; renderLightbox(); });
    lightboxRoot.querySelector('#lb-prev').addEventListener('click', e=>{ e.stopPropagation(); lightboxIdx=(lightboxIdx-1+GALLERY_ITEMS.length)%GALLERY_ITEMS.length; renderLightbox(); });
    lightboxRoot.querySelector('#lb-next').addEventListener('click', e=>{ e.stopPropagation(); lightboxIdx=(lightboxIdx+1)%GALLERY_ITEMS.length; renderLightbox(); });
  }

  section.querySelectorAll('.gallery-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{ lightboxIdx = +btn.getAttribute('data-idx'); renderLightbox(); });
  });

  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && lightboxIdx!==null){ lightboxIdx=null; renderLightbox(); }
  });

  return section;
}

// ============================================================================
// Footer
// ============================================================================
function renderFooter(){
  return el(`
  <footer class="border-t border-isb-border mt-8" style="background:linear-gradient(0deg, rgba(7,9,12,1) 0%, rgba(13,15,20,.8) 100%)">
    <div class="max-w-5xl mx-auto px-4 md:px-12 py-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
          <span class="font-display text-xl font-black text-isb-red glow-red tracking-widest">ISB</span>
          <div class="h-4 w-px bg-isb-border"></div>
          <span class="font-mono text-[10px] text-isb-dim tracking-widest">БАЗА ДАННЫХ ИББ</span>
        </div>
        <div class="flex items-center gap-6 font-mono text-[9px] text-isb-dim tracking-widest">
          <span>ВЕРСИЯ 4.8</span><span class="text-isb-border">|</span>
          <span class="flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full bg-isb-red animate-pulse" style="box-shadow:0 0 6px rgba(225,29,42,.8)"></span>СТАТУС БЕЗОПАСНОСТИ: <span class="text-isb-redglow ml-1">АКТИВЕН</span></span>
        </div>
      </div>
    </div>
  </footer>`);
}

// ============================================================================
// App root
// ============================================================================
function renderApp(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.className = 'isb-grid-bg min-h-screen bg-isb-black';

  let activeSection = 'home';

  function scrollTo(id){
    activeSection = id;
    updateSidebarActive(sidebar, id);
    const target = document.getElementById(id);
    if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  const sidebar = renderSidebar(root, activeSection, scrollTo);

  const main = el(`<main class="md:ml-56"></main>`);
  main.appendChild(renderHome());
  main.appendChild(renderHistory());
  main.appendChild(renderBiology());
  main.appendChild(renderCombat());
  main.appendChild(renderRelations());
  main.appendChild(renderGallery());
  main.appendChild(renderFooter());
  root.appendChild(main);

  // Scroll-spy
  window.addEventListener('scroll', ()=>{
    const sections = NAV_ITEMS.map(n=>document.getElementById(n.id)).filter(Boolean);
    const mid = window.scrollY + window.innerHeight/2.5;
    for(let i=sections.length-1;i>=0;i--){
      if(sections[i].offsetTop <= mid){
        if(activeSection!==sections[i].id){ activeSection=sections[i].id; updateSidebarActive(sidebar, activeSection); }
        return;
      }
    }
  }, { passive:true });
}

// ============================================================================
// Boot
// ============================================================================
renderIntro(renderApp);
</script>
</body>
</html>
